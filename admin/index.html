
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEVA | Administrator Login</title>
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080812;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
        }

        .admin-login {
            width: min(420px, 92%);
            padding: 36px;
            background: #121221;
            border: 1px solid #29243a;
            border-radius: 18px;
            box-shadow: 0 20px 70px #0008;
        }

        .admin-login h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .admin-login p {
            text-align: center;
            color: #aaa;
            margin-bottom: 28px;
        }

        .admin-login input {
            width: 100%;
            padding: 14px;
            margin: 9px 0 16px;
            border: 1px solid #38334b;
            border-radius: 9px;
            background: #090914;
            color: white;
            box-sizing: border-box;
        }

        .admin-login button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(100deg,#8b35f5,#ef315e);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        #loginMessage {
            margin-top: 16px;
            font-size: 13px;
            color: #ff7777;
        }
    </style>
</head>
<body>

    <main class="admin-login">
        <h1>CINEVA</h1>
        <p>Administrator Portal</p>

        <form id="adminLoginForm">
            <label for="email">Administrator Email</label>
            <input id="email" type="email"
                   placeholder="Enter admin email" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Enter password" required>

            <button type="submit" id="loginButton">
                SIGN IN TO DASHBOARD
            </button>

            <div id="loginMessage" role="alert"></div>
        </form>
    </main>

    <script type="module" src="../js/admin-login.js"></script>
</body>
</html>
