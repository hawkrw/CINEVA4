
name: Deploy CINEVA TMDB Importer

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tmdb-image-import/**"
      - ".github/workflows/deploy-tmdb-importer.yml"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy TMDB Importer
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout CINEVA repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy TMDB importer
        run: |
          supabase functions deploy tmdb-image-import \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt
