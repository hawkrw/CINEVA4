name: Deploy CINEVA Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tmdb-image-import/**"
      - "supabase/functions/imagekit-upload-auth/**"
      - "supabase/functions/vip-create-payment/**"
      - "supabase/functions/vip-paypack-webhook/**"
      - ".github/workflows/deploy-tmdb-importer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CINEVA Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout CINEVA repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Validate deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "Missing SUPABASE_PROJECT_ID repository secret" && exit 1)

      - name: Deploy TMDB image importer
        run: supabase functions deploy tmdb-image-import --remote "$SUPABASE_PROJECT_ID" --yes --no-verify-jwt

      - name: Deploy ImageKit upload authorization
        run: supabase functions deploy imagekit-upload-auth --remote "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy VIP payment initiation
        run: supabase functions deploy vip-create-payment --remote "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy Paypack webhook
        run: supabase functions deploy vip-paypack-webhook --remote "$SUPABASE_PROJECT_ID" --yes --no-verify-jwt
