name: Build CINEVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "admin/**"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CINEVA
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare website bundle
        run: npm run mobile:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Generate CINEVA launcher icon from the website logo
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p resources
          convert assets/images/logo.png -background '#080812' -alpha remove -alpha off -resize 1024x1024^ -gravity center -extent 1024x1024 resources/icon.png
          npx --yes @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Increase Gradle wrapper download reliability
        working-directory: android
        run: |
          WRAPPER="gradle/wrapper/gradle-wrapper.properties"
          sed -i 's/-all\\.zip/-bin.zip/' "$WRAPPER"
          if grep -q '^networkTimeout=' "$WRAPPER"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER"
          else
            echo 'networkTimeout=120000' >> "$WRAPPER"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CINEVA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINEVA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cineva-android-latest
          name: CINEVA Android APK
          body: Latest automatically generated CINEVA Android APK. Download app-debug.apk below.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
